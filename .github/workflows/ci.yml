name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bridge-tests:
    name: Python Bridge Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pib_bridge unit tests
        run: python3 -m unittest -v bridge/test_pib_bridge.py

  android-tests-and-build:
    name: Android Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run JVM unit & benchmark tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Assemble Debug & R8 Release (unsigned check)
        run: ./gradlew assembleDebug assembleRelease --no-daemon
